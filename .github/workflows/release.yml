name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.read.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Read application version and verify release tag
        id: read
        run: |
          version="$(python3 -B src/fit8e_version.py)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected release tag v$version, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download official Google Android platform-tools (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "." -Force

      - name: Run profile regression tests (Windows)
        shell: pwsh
        run: python -B -m unittest tests.test_regressions.ProfileTests -v

      - name: Build Windows portable package & Root Scripts bundle
        shell: pwsh
        run: python -B scripts/build_windows_release.py --platform-tools platform-tools

      - name: Upload Windows & Root Scripts artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fit8E-ColorCalib-win64-and-root-scripts
          path: |
            release/Fit8E-ColorCalib-v${{ needs.version.outputs.number }}-win64.zip
            release/Fit8E-ColorCalib-v${{ needs.version.outputs.number }}-root-scripts.zip

  build-unix-source:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run full regression test suite
        run: python3 -B -m unittest discover -s tests -v

      - name: Package macOS / Linux / Shizuku archive
        env:
          VER: ${{ needs.version.outputs.number }}
        run: |
          PKG="Fit8E-ColorCalib-v${VER}-macos-linux-shizuku"
          mkdir -p "release/${PKG}"
          cp -r src assets scripts tests reference README.md README_EN.md CHANGELOG.md LICENSE LICENSES THIRD_PARTY_NOTICES.md "release/${PKG}/"
          chmod +x "release/${PKG}/src/fit8e_color_tool.py" "release/${PKG}/src/build_qdcm_v3.py" "release/${PKG}/src/root_script.py" "release/${PKG}/scripts/fit8e_calib_shizuku.sh"
          (cd release && zip -r "${PKG}.zip" "${PKG}")

      - name: Upload Unix artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fit8E-ColorCalib-unix
          path: release/Fit8E-ColorCalib-v${{ needs.version.outputs.number }}-macos-linux-shizuku.zip

  publish-release:
    needs: [build-windows, build-unix-source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
